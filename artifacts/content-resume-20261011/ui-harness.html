<!doctype html><html lang="ko"><meta charset="utf-8"><title>MUMU CIRCUIT 화면 크기 검증</title>
<style>body{margin:0;background:#223047;color:white;font:13px system-ui}header{display:flex;gap:16px;align-items:center;height:36px;padding:0 8px;position:sticky;top:0;z-index:1;background:#223047}iframe{display:block;border:0}select{font:inherit}</style>
<header><label>게임 화면 크기 <select id="size" aria-label="게임 화면 크기"><option value="1280,720">1280×720</option><option value="1024,768">1024×768</option><option value="844,390">844×390</option><option value="667,375">667×375</option></select></label><span>실제 iframe 크기 · 실기기 검증 아님</span><output id="events" aria-label="입력 사건 기록">입력 대기</output></header>
<iframe id="screen" title="MUMU CIRCUIT 검증 화면" width="1280" height="720" src="../../?track=namak&qaPerf&qaDriver"></iframe>
<script>document.querySelector('#size').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');document.querySelector('#screen').width=w;document.querySelector('#screen').height=h;});
const screenFrame=document.querySelector('#screen'),inputEvents=[];screenFrame.addEventListener('load',()=>{const doc=screenFrame.contentDocument;if(!doc)return;for(const type of ['pointerdown','pointerup','pointercancel','lostpointercapture','keydown','keyup'])doc.addEventListener(type,event=>{const button=event.target.closest?.('.touch-controls button');if(!button&&!['KeyW','KeyA','KeyD','Escape'].includes(event.code))return;inputEvents.push({type,code:event.code||button?.textContent.trim(),pointerId:event.pointerId});if(inputEvents.length>40)inputEvents.shift();document.querySelector('#events').textContent=JSON.stringify(inputEvents);},true);});
</script></html>
