<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUMU · 그래픽 전후 비교</title><link rel="icon" href="data:,">
<style>html,body{margin:0;background:#08111c;color:#e7eef7;font:15px system-ui}main{max-width:1280px;margin:auto;padding:24px}h1{font-size:26px;margin:8px 0}p{color:#a8b9cb;line-height:1.6}header{display:flex;flex-wrap:wrap;align-items:center;gap:12px}select,button{background:#14283d;color:#e5f0fc;padding:11px;border:1px solid #36536f;border-radius:6px}figure{margin:20px 0;position:relative;aspect-ratio:16/9;overflow:hidden;background:#020912}figure img{position:absolute;width:100%;height:100%;object-fit:contain}#before{clip-path:inset(0 50% 0 0)}#divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff9}input{width:100%}.pill{position:absolute;top:15px;background:#06111cd9;padding:8px;border:1px solid #49657a}#old{left:15px}#new{right:15px}small{color:#92aac3}a{color:#85caff}</style>
<main><small>MUMU CIRCUIT / GRAPHICS / 2026.10.13</small><h1>맵별 그래픽 전후 비교</h1><p>슬라이더를 움직여 같은 카메라의 기준·개선 화면을 비교하세요. 별도 실제 WebGL 장면 검수 캡처입니다. 사용자 화면 검수·휴대폰 실기기 시험과 구분합니다.</p>
<header><select id="track"><option value="namak">남악 시티</option><option value="yeosu">여수 밤바다</option><option value="seongsamjae">지리산 성삼재</option><option value="coastal">해안 월드</option></select><select id="point"></select><a id="play" href="/?track=namak" target="_blank">현재 로컬 게임 열기 →</a></header>
<figure><img id="after" alt="개선 화면"><img id="before" alt="기준 화면"><div id="divider"></div><span class="pill" id="old">기준</span><span class="pill" id="new">개선</span></figure><input id="slider" type="range" min="0" max="100" value="50" aria-label="전후 비교 경계"><p id="note"></p><small>원본 경로·충돌·모델은 보존했습니다. 표시층의 재질·수면·식생과 품질별 비용을 조정한 결과이며, 전체 지형/건물을 새로 재제작한 결과가 아닙니다.</small></main>
<script type="module">
const track=document.getElementById('track'),point=document.getElementById('point'),before=document.getElementById('before'),after=document.getElementById('after'),note=document.getElementById('note'),slider=document.getElementById('slider');let pairs=[];
function show(){const p=pairs[Number(point.value)||0];before.src=p.before;after.src=p.after;note.textContent=p.note;document.getElementById('play').href='/?track='+track.value;}
async function load(){if(track.value==='namak'||track.value==='yeosu'){pairs=[{before:`quiet-scene-${track.value}-high-1-before.png`,after:`quiet-scene-${track.value}-high-3-after.png`,note:'1280×720 / DPR1 / 높음 / 도로 진입 · 최종 조명 환경'}];}
else{const r=await(await fetch(`final-gallery-fixed-${track.value}.json`)).json();pairs=r.rows.filter(s=>s.value).map(a=>({after:a.path.split('/').at(-1),before:r.rows.find(b=>b.index===a.index&&!b.value).path.split('/').at(-1),note:`1280×720 / DPR1 / 높음 / 경로 지점 ${a.index}`}));}
point.innerHTML=pairs.map((p,i)=>`<option value="${i}">시점 ${i+1}</option>`).join('');show();}
slider.oninput=()=>{before.style.clipPath=`inset(0 ${100-Number(slider.value)}% 0 0)`;document.getElementById('divider').style.left=slider.value+'%';};track.onchange=load;point.onchange=show;await load();
</script></html>
