<script type="module">

const params=new URLSearchParams(location.search),track=TRACKS.find(t=>t.id===params.get('track'))||TRACKS[0],quality=qualityById(params.get('quality')||'high');
const scene=new THREE.Scene(),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Number(params.get('dpr'))||1);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=quality.shadows;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.info.autoReset=false;

const lighting=track.night?NIGHT_LIGHTING:mountain?MOUNTAIN_LIGHTING:outdoorLighting(namak),atmosphere=track.night?NIGHT_ATMOSPHERE:mountain?MOUNTAIN_ATMOSPHERE:outdoorAtmosphere(namak);

const envScene=track.night?new RoomEnvironment():new THREE.Scene();if(!track.night)envScene.add(sky);const pmrem=new THREE.PMREMGenerator(renderer),env=pmrem.fromScene(envScene,track.night?.035:.04);scene.environment=env.texture;scene.environmentIntensity=lighting.environment;pmrem.dispose();if(track.night)envScene.dispose();if(!track.night)scene.add(sky);

 const world=(await loader.loadAsync('/assets/rebuild/'+track.world+'.glb')).scene,route=await (await fetch('/assets/rebuild/'+track.route)).json();
 world.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;}});scene.add(world);
 polishWorldSurfaces(world,{namak});if(namak)applyNamakColors(world);else applyKoreaPalette(world,track.id);
 const batching=batchWorldScenery(world),night=track.night?createNightPresentation(scene,route):null;
 const paths={namak:'/src/rebuild/namakVisuals.js',yeosu:'/src/rebuild/yeosuVisuals.js',seongsamjae:'/src/rebuild/seongsamjaeVisuals.js',coastal:'/src/rebuild/coastalVisuals.js'},fn={namak:'createNamakVisuals',yeosu:'createYeosuVisuals',seongsamjae:'createSeongsamjaeVisuals',coastal:'createCoastalVisuals'};
 const module=await import(/* @vite-ignore */paths[track.id]),visuals=module[fn[track.id]](scene,world,route,{quality});
 const decor=createDecorationQuality(world);decor.set(quality.decorationDistance);
 const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info');
 let index=Number(params.get('index'))||0,elapsed=0,last=0,enhanced=false,sampling=null;
 const extension=track.roadscape?(await loader.loadAsync('/assets/rebuild/'+track.roadscape)).scene:null;
 if(extension){extension.traverse(o=>{if(o.isMesh)o.castShadow=o.receiveShadow=false;});world.add(extension);}
 const roadscape=createRoadscape(extension,{quality}),staticWorld=freezeStaticWorld(world),daylight=track.night?null:createDaylightSky(sky,track.id,quality);
 const context={track:track.id,quality:quality.id,width:innerWidth,height:innerHeight,dpr:renderer.getPixelRatio(),gpu:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),userAgent:navigator.userAgent,batching,worldLoadMs:performance.now()-started};
 function point(){return route.points[((index%route.points.length)+route.points.length)%route.points.length];}
 function positionCamera(){const p=point(),f=new THREE.Vector3(p.dx,0,p.dz).normalize(),side=new THREE.Vector3(f.z,0,-f.x);camera.position.set(p.x,p.y+3.2,p.z).addScaledVector(f,-9).addScaledVector(side,1.2);camera.lookAt(new THREE.Vector3(p.x,p.y+1.4,p.z).addScaledVector(f,48));sun.position.set(p.x-25,p.y+45,p.z+20);sun.target.position.set(p.x,p.y,p.z);camera.updateMatrixWorld(true);}
 async function setEnhanced(value){
 enhanced=value;roadscape?.update(camera,0,elapsed,value);
 document.getElementById('title').textContent=track.name+' · '+(value?'도로 환경 개선':'현재 배포 기준')+' · '+quality.label;
 await renderer.compileAsync(scene,camera);
 }
 function summary(rows){const values=rows.map(r=>r.ms).sort((a,b)=>a-b),sum=k=>rows.reduce((n,r)=>n+r[k],0)/rows.length;return {samples:rows.length,meanMs:sum('ms'),p95Ms:values[Math.ceil(values.length*.95)-1],maxMs:values.at(-1),over50Ms:values.filter(v=>v>50).length,cpuSubmitMs:sum('cpu'),calls:rows.at(-1)?.calls,triangles:rows.at(-1)?.triangles,firstFrame:rows[0],lastFrame:rows.at(-1)};}
 function frame(now){const dt=last?Math.min(.05,(now-last)/1000):0;elapsed+=dt;positionCamera();if(!track.night)sky.position.copy(camera.position);night?.update({position:new THREE.Vector3(point().x,point().y+.53,point().z),rotation:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),Math.atan2(point().dx,point().dz))},index,true,camera.position);decor.update(camera);visuals?.update(camera,dt,elapsed,true);roadscape?.update(camera,dt,elapsed,enhanced);daylight?.update(dt,elapsed);const cpu=performance.now();renderer.info.reset();renderer.render(scene,camera);const submission=performance.now()-cpu;
  if(sampling&&last&&now>=sampling.from){sampling.rows.push({now,ms:now-last,cpu:submission,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,visible:document.visibilityState==='visible',focused:document.hasFocus()});if(now>=sampling.until){const s=sampling;sampling=null;s.resolve({context:{...context,index,enhanced,visuals:{...visuals?.stats},roadscape:{...roadscape?.stats},staticWorld:{...staticWorld?.stats}},...summary(s.rows),raw:s.rows,errors:[...errors]});}}
  last=now;requestAnimationFrame(frame);
 }
 window.graphicsProbe={context,regions:[...new Set(route.points.map(p=>p.region))],routePoints:route.points.length,async enhanced(v){await setEnhanced(v);},async camera(i){index=i;positionCamera();await renderer.compileAsync(scene,camera);},find(region){return route.points.findIndex(p=>p.region===region);},sample(seconds=30){if(sampling)throw Error('measurement already active');return new Promise(resolve=>{sampling={from:performance.now()+3000,until:performance.now()+3000+seconds*1000,rows:[],resolve};});},snapshot(){return {context:{...context,index,enhanced},visuals:visuals?.stats,roadscape:roadscape?.stats,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,errors};}};
 positionCamera();await renderer.compileAsync(scene,camera);document.getElementById('title').textContent=`${track.name} · 기준 · ${quality.label}`;requestAnimationFrame(frame);window.graphicsReady=true;
 document.querySelector('#index').value=index;
 document.querySelector('#move').onclick=async()=>{await window.graphicsProbe.camera(Number(document.querySelector('#index').value));};
 document.querySelector('#before').onclick=()=>setEnhanced(false);document.querySelector('#after').onclick=()=>setEnhanced(true);
 document.querySelector('#measure').onclick=async()=>{const button=document.querySelector('#measure');button.disabled=true;const rows=[];for(const value of [false,true,false]){await setEnhanced(value);document.querySelector('#status').textContent=`${rows.length+1}/3 · 3초 준비 + 30초 측정`;rows.push(await window.graphicsProbe.sample(30));}const report=document.querySelector('#report');report.style.display='block';report.value=JSON.stringify({execution:'CUA in-app browser, fixed camera A/B/A, 30 seconds each; rendering only, no vehicle physics',results:rows},null,2);document.querySelector('#status').textContent='A/B/A 측정 완료';button.disabled=false;};
}catch(e){document.getElementById('status').textContent=e.message;window.graphicsFailure=String(e.stack||e);console.error(e);}finally{decoder.dispose();}
</script></html>
